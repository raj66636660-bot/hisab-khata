<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>হিসাব খাতা</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF5EA; --paper-deep:#F3EBDA; --line:#DDD0B4; --ink:#2A2318; --ink-soft:#6B6350;
    --green:#204E3F; --green-deep:#163a2f; --green-tint:#E9F0EC; --gold:#B8862E;
    --due:#B14B32; --due-tint:#F7E9E4; --paid:#3D7A56; --paid-tint:#E8F1EB;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:'Hind Siliguri', sans-serif; min-height:100vh; -webkit-tap-highlight-color: transparent;}
  .app{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

  header.cover{background: linear-gradient(180deg,var(--green) 0%, var(--green-deep) 100%); color:#F4EFE2; padding:22px 20px 16px; position:relative; border-bottom:3px solid var(--gold);}
  header.cover::after{content:""; position:absolute; left:0; right:0; bottom:-3px; height:6px; background: repeating-linear-gradient(90deg, var(--gold) 0 10px, transparent 10px 20px); opacity:.55;}
  .cover-top{position:relative; display:flex; flex-direction:column; align-items:center; text-align:center; gap:4px; padding-top:4px; min-height:44px; justify-content:center;}
  .cover-title-wrap{display:flex; flex-direction:column; align-items:center; gap:4px;}
  .brand-logo{position:absolute; top:0; left:0; width:44px; height:44px; border-radius:10px; object-fit:cover; mix-blend-mode:multiply;}
  html[dir="rtl"] .brand-logo{left:auto; right:0;}
  .brand-logo-placeholder{position:absolute; top:0; left:0; width:44px; height:44px; border-radius:10px; background:rgba(244,239,226,.12); border:1px dashed rgba(244,239,226,.3);}
  html[dir="rtl"] .brand-logo-placeholder{left:auto; right:0;}
  .gear-btn{position:absolute; top:0; right:0;}
  html[dir="rtl"] .gear-btn{right:auto; left:0;}
  .cover-title{font-family:'Tiro Bangla', serif; font-size:24px; letter-spacing:.3px; margin:0;}
  .gear-btn{background:none; border:1px solid rgba(244,239,226,.4); color:#F4EFE2; width:34px; height:34px; border-radius:50%; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .cover-sub{font-size:12.5px; opacity:.75; margin:4px 0 0;}

  nav.tabs{display:flex; gap:2px; background:var(--paper-deep); border-bottom:1px solid var(--line); overflow-x:auto;}
  nav.tabs button{flex:1; min-width:110px; border:none; background:transparent; cursor:pointer; font-family:'Hind Siliguri',sans-serif; font-size:14.5px; color:var(--ink-soft); padding:12px 10px 10px; border-bottom:3px solid transparent;}
  nav.tabs button.active{color:var(--green); border-bottom-color:var(--gold); font-weight:600;}

  main{flex:1; padding:18px 18px 40px;}

  .stats-row{display:flex; border:1px solid var(--line); background:#fff;}
  .stat{flex:1; padding:14px 10px; text-align:center; position:relative;}
  .stat:not(:last-child)::after{content:""; position:absolute; right:0; top:14%; bottom:14%; width:1px; background:var(--line);}
  .stat .num{font-size:20px; font-weight:700; font-variant-numeric:tabular-nums;}
  .stat .lbl{font-size:12px; color:var(--ink-soft); margin-top:3px;}
  .stat.due .num{color:var(--due);}
  .stat.paid .num{color:var(--paid);}

  h2.section-title{font-family:'Tiro Bangla', serif; font-weight:400; font-size:17px; margin:26px 0 10px; color:var(--green-deep);}

  .activity-row, .cust-row{display:flex; align-items:center; justify-content:space-between; padding:9px 12px; border-bottom:1px dashed var(--line); background:#fff; cursor:pointer;}
  .activity-row:last-child, .cust-row:last-child{border-bottom:none;}
  .activity-row .who{font-size:14px;}
  .activity-row .meta{font-size:11.5px; color:var(--ink-soft);}
  .amt{font-variant-numeric:tabular-nums; font-weight:600; font-size:14px;}
  .amt.plus{color:var(--due);}
  .amt.minus{color:var(--paid);}

  .cust-row{border:1px solid var(--line); border-top:none; background:#fff;}
  .cust-row:first-child{border-top:1px solid var(--line);}
  .cust-name{font-size:15px; font-weight:600;}
  .cust-phone{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .due-pill{font-size:13px; font-weight:700; font-variant-numeric:tabular-nums;}
  .due-pill.has-due{color:var(--due);}
  .due-pill.clear{color:var(--paid); font-weight:500; font-size:12px;}

  .row-between{display:flex; align-items:center; justify-content:space-between; gap:10px;}

  button.primary{background:var(--green); color:#F4EFE2; border:none; padding:10px 16px; font-family:'Hind Siliguri',sans-serif; font-size:14px; cursor:pointer; font-weight:600;}
  button.primary:active{background:var(--green-deep);}
  button.primary:disabled{opacity:.5; cursor:not-allowed;}
  button.danger{background:var(--due); color:#fff; border:none; padding:10px 16px; font-family:'Hind Siliguri',sans-serif; font-size:14px; cursor:pointer; font-weight:600;}
  button.ghost{background:transparent; color:var(--green); border:1px solid var(--green); padding:9px 14px; font-size:13.5px; cursor:pointer; font-family:'Hind Siliguri',sans-serif;}
  button.link-back{background:none; border:none; color:var(--ink-soft); font-size:13px; cursor:pointer; padding:0; margin-bottom:10px; font-family:'Hind Siliguri',sans-serif;}

  .empty{text-align:center; padding:34px 16px; color:var(--ink-soft); border:1px dashed var(--line); background:#fff;}
  .empty p{margin:0 0 12px; font-size:13.5px;}

  .overlay{position:fixed; inset:0; background:rgba(30,25,15,.45); display:flex; align-items:flex-end; justify-content:center; z-index:50;}
  .sheet{background:var(--paper); width:100%; max-width:720px; border-top:3px solid var(--gold); padding:18px 18px 22px; max-height:88vh; overflow-y:auto;}
  .sheet h3{font-family:'Tiro Bangla',serif; font-weight:400; font-size:18px; margin:0 0 14px; color:var(--green-deep);}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:4px;}
  .field input, .field select, .field textarea{width:100%; border:1px solid var(--line); background:#fff; padding:9px 10px; font-family:'Hind Siliguri',sans-serif; font-size:14.5px; color:var(--ink); outline:none;}
  .field input:focus{border-color:var(--green);}
  .field .err{font-size:11.5px; color:var(--due); margin-top:4px;}
  .seg{display:flex; border:1px solid var(--green); overflow:hidden;}
  .seg button{flex:1; border:none; background:#fff; padding:9px; font-family:'Hind Siliguri',sans-serif; font-size:13.5px; cursor:pointer; color:var(--green);}
  .seg button.on{background:var(--green); color:#fff;}
  .sheet-actions{display:flex; gap:10px; margin-top:16px;}
  .sheet-actions button{flex:1;}
  .divider{border-top:1px dashed var(--line); margin:18px 0;}

  .cust-head{background:#fff; border:1px solid var(--line); padding:14px 16px; margin-bottom:16px;}
  .cust-head .name{font-size:18px; font-weight:700;}
  .cust-head .phone{font-size:13px; color:var(--ink-soft); margin-top:2px;}
  .cust-head .stats-row{margin-top:12px; border-left:none; border-right:none;}

  .msg-row{display:flex; gap:8px; margin:14px 0 4px; flex-wrap:wrap;}
  .msg-btn{flex:1; min-width:150px; border:1px solid var(--line); background:#fff; padding:9px 10px; font-family:'Hind Siliguri',sans-serif; font-size:13px; cursor:pointer; color:var(--ink); display:flex; align-items:center; justify-content:center; gap:6px; text-decoration:none;}
  .msg-btn.wa{border-color:#25D366; color:#128C4A;}
  .msg-btn.sms{border-color:var(--gold); color:#8a651f;}

  .add-btns{display:flex; gap:10px; margin:16px 0;}
  .add-btns button{flex:1; padding:10px;}

  .toast{position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:10px 18px; font-size:13px; border-radius:3px; z-index:80; max-width:88%; text-align:center;}

  .gate-screen{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px 24px; text-align:center;}
  .gate-card{width:100%; max-width:380px; background:#fff; border:1px solid var(--line); padding:24px 20px; text-align:left;}
  .gate-title{font-family:'Tiro Bangla',serif; font-size:22px; color:var(--green-deep); margin:0 0 16px; text-align:center;}

  .lang-switch{display:flex; gap:6px; margin-bottom:14px; justify-content:center;}
  .lang-switch button{border:1px solid var(--line); background:#fff; color:var(--ink-soft); padding:6px 14px; font-size:12.5px; cursor:pointer; border-radius:3px; font-family:inherit;}
  .lang-switch button.on{background:var(--green); color:#fff; border-color:var(--green);}

  html[dir="rtl"] body{font-family:'Segoe UI', Tahoma, 'Hind Siliguri', sans-serif;}
  html[dir="rtl"] .cover-title, html[dir="rtl"] .gate-title, html[dir="rtl"] h2.section-title, html[dir="rtl"] .sheet h3{font-family:inherit;}
  html[dir="rtl"] .stat:not(:last-child)::after{right:auto; left:0;}
  html[dir="rtl"] .link-back{text-align:right;}

  .phone-group{display:flex; gap:6px;}
  .phone-group select{flex:0 0 auto; width:38%; border:1px solid var(--line); background:#fff; padding:9px 4px; font-family:'Hind Siliguri',sans-serif; font-size:12.5px; color:var(--ink);}
  .phone-group input{flex:1; min-width:0;}

  ::-webkit-scrollbar{width:0;height:0;}
</style>
</head>
<body>
<div id="root" class="app"><div style="padding:40px;text-align:center;color:#6B6350;">লোড হচ্ছে…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
